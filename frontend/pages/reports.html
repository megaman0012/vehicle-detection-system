<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Sistema de Detección de Vehículos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="bg-white" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 primary-text fs-4">
                <i class="fas fa-car-mechanical"></i> Sistema de Detección
            </div>
            <div class="list-group list-group-flush my-3">
                <a href="../index.html" class="list-group-item list-group-item-action bg-transparent second-text" data-page="dashboard">
                    <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                </a>
                <a href="cameras.html" class="list-group-item list-group-item-action bg-transparent second-text" data-page="cameras">
                    <i class="fas fa-video me-2"></i>Cámaras
                </a>
                <a href="parking.html" class="list-group-item list-group-item-action bg-transparent second-text" data-page="parking">
                    <i class="fas fa-parking me-2"></i>Estacionamiento
                </a>
                <a href="events.html" class="list-group-item list-group-item-action bg-transparent second-text" data-page="events">
                    <i class="fas fa-list me-2"></i>Historial de Eventos
                </a>
                <a href="reports.html" class="list-group-item list-group-item-action bg-transparent second-text active" data-page="reports">
                    <i class="fas fa-file-alt me-2"></i>Reportes
                </a>
                <a href="settings.html" class="list-group-item list-group-item-action bg-transparent second-text" data-page="settings">
                    <i class="fas fa-cog me-2"></i>Configuración
                </a>
                <a href="users.html" class="list-group-item list-group-item-action bg-transparent second-text" data-page="users">
                    <i class="fas fa-user-shield me-2"></i>Usuarios
                </a>
            </div>
        </div>
        <!-- /#sidebar-wrapper -->

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-transparent py-4 px-4">
                <div class="d-flex align-items-center">
                    <i class="fas fa-align-left primary-text fs-4 me-3" id="menu-toggle"></i>
                    <h2 class="fs-2 m-0">Reportes</h2>
                </div>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle second-text fw-bold" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fas fa-user me-1"></i> Administrador
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                                <li><a class="dropdown-item" href="#" id="userFullName"><i class="fas fa-user me-2"></i> Administrador</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt me-2"></i> Cerrar Sesión</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Reports Content -->
            <div class="container-fluid px-4" id="reports-content">
                <!-- Estadísticas -->
                <div class="row g-3 mb-4">
                    <div class="col-md-3">
                        <div class="card h-100">
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="text-muted">Eventos Totales</h6>
                                        <h3 class="mb-0" id="stat-total-events">-</h3>
                                    </div>
                                    <i class="fas fa-bell fa-2x text-primary"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card h-100">
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="text-muted">Eventos (30 días)</h6>
                                        <h3 class="mb-0" id="stat-events-30d">-</h3>
                                    </div>
                                    <i class="fas fa-calendar-alt fa-2x text-info"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card h-100">
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="text-muted">Vehículos Detectados</h6>
                                        <h3 class="mb-0" id="stat-total-vehicles">-</h3>
                                    </div>
                                    <i class="fas fa-car fa-2x text-success"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card h-100">
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="text-muted">Estacionados Ahora</h6>
                                        <h3 class="mb-0" id="stat-parked-now">-</h3>
                                    </div>
                                    <i class="fas fa-parking fa-2x text-warning"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Generación de reportes -->
                <div class="row mb-4">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0">Generar Reporte</h5>
                            </div>
                            <div class="card-body">
                                <form id="reportForm">
                                    <div class="row g-3 align-items-end">
                                        <div class="col-md-3">
                                            <label class="form-label">Tipo de Reporte</label>
                                            <select class="form-select" id="reportType">
                                                <option value="daily">Diario</option>
                                                <option value="weekly">Semanal</option>
                                                <option value="monthly">Mensual</option>
                                            </select>
                                        </div>
                                        <div class="col-md-3">
                                            <label class="form-label">Formato</label>
                                            <select class="form-select" id="reportFormat">
                                                <option value="pdf">PDF</option>
                                                <option value="excel">Excel</option>
                                            </select>
                                        </div>
                                        <div class="col-md-3" id="reportDailyField">
                                            <label class="form-label">Fecha</label>
                                            <input type="date" class="form-control" id="reportDailyDate">
                                        </div>
                                        <div class="col-md-3" id="reportWeeklyField" style="display:none;">
                                            <label class="form-label">Fecha de Inicio (semana)</label>
                                            <input type="date" class="form-control" id="reportWeeklyDate">
                                        </div>
                                        <div class="col-md-3" id="reportMonthlyField" style="display:none;">
                                            <label class="form-label">Mes</label>
                                            <input type="month" class="form-control" id="reportMonthlyDate">
                                        </div>
                                        <div class="col-md-3">
                                            <button type="submit" class="btn btn-primary w-100" id="generateReportBtn">
                                                <i class="fas fa-download me-1"></i> Generar y Descargar
                                            </button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- /#page-content-wrapper -->
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- API client -->
    <script src="../js/api.js"></script>
    <!-- Shared utilities -->
    <script src="../js/common.js"></script>
    <!-- Custom JS -->
    <script src="../js/reports.js"></script>
</body>
</html>
